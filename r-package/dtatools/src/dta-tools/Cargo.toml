[package]
name = "dta-tools"
version = "0.6.0"
description = "Read, write, and model Stata .dta datasets"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.98.0"
repository = "https://github.com/jbearak/dta-tools"
publish = false
exclude = ["tests/**"]

[dependencies]
arrow-array = "59.2.0"
arrow-buffer = "59.2.0"
arrow-data = "59.2.0"
arrow-ipc = { version = "59.2.0", features = ["lz4", "zstd"] }
arrow-schema = "59.2.0"
arrow-select = "59.2.0"
encoding_rs = "0.8"
lz4_flex = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
twox-hash = "2.1"
unicode-general-category = "1.1.0"
zstd = "0.13"

[dev-dependencies]
serde_json = "1.0"
sha2 = "0.10"
