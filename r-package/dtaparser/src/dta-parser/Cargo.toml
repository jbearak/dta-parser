[package]
name = "dta-parser"
version = "0.5.0"
description = "Column-oriented parser for Stata .dta files"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.98.0"
repository = "https://github.com/jbearak/dta-parser"
publish = false
exclude = ["tests/**"]

[dependencies]
encoding_rs = "0.8"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"
sha2 = "0.10"
