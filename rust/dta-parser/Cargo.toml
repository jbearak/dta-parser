[package]
name = "dta-parser"
version = "0.1.0"
description = "Metadata parser for modern Stata .dta files"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/jbearak/dta-parser"
readme = "README.md"
exclude = ["tests/metadata.rs"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"
