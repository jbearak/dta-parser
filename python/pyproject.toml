[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "dta-parser"
version = "0.1.0"
description = "Read and write Stata .dta files into pandas, keeping .a to .z missing values"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=2.2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[project.optional-dependencies]
test = ["pytest", "pyreadstat"]

[tool.maturin]
module-name = "dta_parser._native"
python-source = "."
python-packages = ["dta_parser"]
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
