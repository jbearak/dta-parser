[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dta-datakit"
version = "0.3.0"
description = "Data preparation in polars that keeps Stata's labels and .a to .z: Parquet, .dta and fixed-width files"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = ["polars>=2.0,<3", "dta-parser>=0.4,<0.5"]
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest", "pyarrow", "duckdb"]

[tool.setuptools]
packages = ["datakit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
