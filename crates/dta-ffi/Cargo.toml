[package]
name = "dta-ffi"
description = "The C ABI over the dta crate that the npm package's wasm module exports"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.82"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
dta = { path = "../dta" }

[features]
default = ["wasm-dta"]
# The .dta exports: @jbearak/dta-parser's module.
wasm-dta = []
# Test builds of the wasm module: `dta_test_set` lowers the read budget
# and chunk size. Never in the published module.
test-hooks = []
