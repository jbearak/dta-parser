[package]
name = "dta-ffi"
description = "C ABIs over the dta crate: wasm for npm, native for Julia"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.82"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
dta = { path = "../dta" }
# Optional on wasm, so the .dta module carries no Parquet code or
# libzstd (plan 0021); always there for the native library.
dta-parquet = { path = "../parquet", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dta-parquet = { path = "../parquet" }

[features]
default = ["wasm-dta", "wasm-parquet"]
# The .dta exports: @jbearak/dta-parser's module.
wasm-dta = []
# The Parquet and fixed-width exports: @jbearak/datakit's module.
wasm-parquet = ["dep:dta-parquet"]
# Test builds of the wasm module: `dta_test_set` lowers the read budget
# and chunk size. Never in the published module.
test-hooks = []

[dev-dependencies]
serde_json = "1"
