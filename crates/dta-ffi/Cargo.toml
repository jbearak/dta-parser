[package]
name = "dta-ffi"
description = "The C ABI over the dta crate that the npm packages' wasm modules export"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.82"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
dta = { path = "../dta" }
# Optional, so the .dta module carries no Parquet code or libzstd
# (plan 0021).
dta-parquet = { path = "../parquet", optional = true }

[features]
default = ["wasm-dta", "wasm-parquet"]
# The .dta exports: @jbearak/dta-parser's module.
wasm-dta = []
# The Parquet and fixed-width exports: @jbearak/datakit's module.
wasm-parquet = ["dep:dta-parquet"]
# Test builds of the wasm module: `dta_test_set` lowers the read budget
# and chunk size. Never in the published module.
test-hooks = []
