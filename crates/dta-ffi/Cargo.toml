[package]
name = "dta-ffi"
description = "C ABIs over the dta crate: wasm for npm, native for Julia"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.82"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
dta = { path = "../dta" }

[features]
# Test builds of the wasm module: `dta_test_set` lowers the read budget
# and chunk size. Never in the published module.
test-hooks = []

[dev-dependencies]
serde_json = "1"
