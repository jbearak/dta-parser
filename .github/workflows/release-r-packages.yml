name: Attach compiled R packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach binaries to
        required: true
        type: string

jobs:
  build:
    name: R binary / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_toolchain }}
      R_RELEASE_DEP_LIB: ${{ github.workspace }}/release-runtime-library
      R_LIBS_USER: ${{ github.workspace }}/release-runtime-library
      # Match the minimum macOS version of the R 4.6 ARM64 distribution.
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            rust_toolchain: 1.98.0
          - os: macos-latest
            platform: macos-arm64
            rust_toolchain: 1.98.0
          - os: windows-latest
            platform: windows-x86_64
            rust_toolchain: 1.98.0-x86_64-pc-windows-gnu
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Disable unused Chrome apt repository
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Chrome is not used by these R jobs. A stale browser index must not
          # prevent setup-r from installing R and its system dependencies.
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [[ -f "$source" ]]; then
              sudo mv "$source" "$source.disabled"
            fi
          done

      - name: Set up R release
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          r-version: release
          use-public-rspm: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Verify R architecture
        shell: bash
        env:
          ASSET_PLATFORM: ${{ matrix.platform }}
        run: |
          r_platform="$(Rscript --vanilla -e "cat(R.version[['platform']])")"
          case "$ASSET_PLATFORM:$r_platform" in
            linux-x86_64:x86_64-*|macos-arm64:aarch64-*|macos-arm64:arm64-*|windows-x86_64:x86_64-*) ;;
            *)
              echo "R platform $r_platform does not match release asset $ASSET_PLATFORM" >&2
              exit 1
              ;;
          esac

      - name: Install Rust
        if: runner.os != 'Windows'
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"

      - name: Install Rust for Rtools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
          rust_version="$(rustc --version | awk '{print $2}')"
          rust_host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$rust_version-$rust_host" != "$RUSTUP_TOOLCHAIN" ]; then
            echo "Rust $rust_version host $rust_host does not match $RUSTUP_TOOLCHAIN" >&2
            exit 1
          fi

      - name: Install CRAN macOS gettext build dependencies
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        shell: bash
        run: |
          base=https://mac.r-project.org/bin/darwin23/arm64
          cache="$RUNNER_TEMP/cran-gettext"
          mkdir -p "$cache"
          curl --fail --show-error --location --retry 3 "$base/texinfo-7.3-darwin.23-arm64.tar.xz" -o "$cache/texinfo.tar.xz"
          curl --fail --show-error --location --retry 3 "$base/gettext-0.22.5-darwin.23-arm64.tar.xz" -o "$cache/gettext.tar.xz"
          printf '%s  %s\n' \
            '78b7af1aea3fd725a77c6cc7295a717bdc94e1d534c5acb3801646d72c4515dd' "$cache/texinfo.tar.xz" \
            'bdc3356cfb2c8dd69618fd76975474f4ec793cbe8f4894389d0426da8f4facc3' "$cache/gettext.tar.xz" | shasum -a 256 -c -
          sudo tar -xf "$cache/texinfo.tar.xz" -C /
          sudo tar -xf "$cache/gettext.tar.xz" -C /
          test -s /opt/R/arm64/include/libintl.h
          test -s /opt/R/arm64/lib/libintl.a

      - name: Identify compiled runtime dependency library
        id: dependency-key
        shell: bash
        run: >-
          Rscript scripts/install-r-runtime-dependencies.R key
          r-package/dtatools "$R_RELEASE_DEP_LIB"

      - name: Restore compiled dependencies across release tags
        id: restore-dependencies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_ARTIFACT: ${{ steps.dependency-key.outputs.cache_key }}
        run: python scripts/restore-r-dependencies.py "$DEPENDENCY_ARTIFACT" "$R_RELEASE_DEP_LIB"

      - name: Install only missing runtime dependencies
        id: runtime-dependencies
        shell: bash
        run: >-
          Rscript scripts/install-r-runtime-dependencies.R install
          r-package/dtatools "$R_RELEASE_DEP_LIB"

      - name: Retain reusable compiled dependency library
        if: steps.restore-dependencies.outputs.cache_hit != 'true' && steps.runtime-dependencies.outputs.cache_populated == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.dependency-key.outputs.cache_key }}
          path: ${{ env.R_RELEASE_DEP_LIB }}
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Build binary package
        id: package
        shell: bash
        env:
          ASSET_PLATFORM: ${{ matrix.platform }}
        run: |
          workspace="$PWD"
          package_version="$(Rscript --vanilla -e 'cat(read.dcf("r-package/dtatools/DESCRIPTION", fields = "Version"))')"
          r_version="$(Rscript --vanilla -e 'cat(as.character(getRversion()))')"
          r_platform="$(Rscript --vanilla -e "cat(R.version[['platform']])")"
          source_dir="$workspace/release-build/source"
          binary_dir="$workspace/release-build/binary"
          library_dir="$workspace/release-build/library"
          mkdir -p "$source_dir" "$binary_dir" "$library_dir"

          source_archive="$source_dir/dtatools_${package_version}.tar.gz"
          (cd "$source_dir" && R CMD build --no-manual --no-build-vignettes "$workspace/r-package/dtatools")
          "$workspace/scripts/check-r-package-archive.sh" "$source_archive"

          # Compile the product once. The fresh binary below is installed again
          # without compilation for the smoke test; full suites run locally.
          (
            cd "$binary_dir"
            R CMD INSTALL --build --library="$library_dir" "$source_archive"
          )

          case "$ASSET_PLATFORM" in
            windows-*) generated="$binary_dir/dtatools_${package_version}.zip"; extension=zip ;;
            macos-*) generated="$binary_dir/dtatools_${package_version}.tgz"; extension=tgz ;;
            linux-*) generated="$binary_dir/dtatools_${package_version}_R_${r_platform}.tar.gz"; extension=tar.gz ;;
          esac
          if [ ! -f "$generated" ]; then
            echo "R CMD INSTALL did not create the expected binary: $generated" >&2
            find "$binary_dir" -maxdepth 1 -type f -print >&2
            exit 1
          fi

          asset_name="dtatools_${package_version}_R-${r_version}_${ASSET_PLATFORM}.${extension}"
          asset="$binary_dir/$asset_name"
          mv "$generated" "$asset"
          echo "asset=release-build/binary/$asset_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=r-package-$ASSET_PLATFORM" >> "$GITHUB_OUTPUT"

      - name: Check portable macOS R linkage
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sh scripts/check-macos-r-linkage.sh \
            release-build/library/dtatools/libs/dtatools.so

      - name: Install the produced binary into a fresh library
        shell: bash
        env:
          BINARY_ASSET: ${{ steps.package.outputs.asset }}
        run: |
          mkdir -p release-build/fresh-library
          R CMD INSTALL --library=release-build/fresh-library "$BINARY_ASSET"

      - name: Smoke test the exact fresh binary
        shell: Rscript {0}
        run: |
          .libPaths(c(file.path(getwd(), "release-build", "fresh-library"), .libPaths()))
          library(dtatools)
          expected_path <- normalizePath(file.path("release-build", "fresh-library", "dtatools"))
          actual_path <- normalizePath(getNamespaceInfo(loadNamespace("dtatools"), "path"))
          stopifnot(identical(actual_path, expected_path))
          stopifnot(identical(as.numeric(dta_float(c(1, 2, NA_real_)) + dta_long(c(2, 3, 4))), c(3, 5, NA_real_)))
          data <- data.frame(value = c(1.5, -2, NA_real_), code = c("a", "b", ""))
          path <- tempfile(fileext = ".dta")
          save_dta(data, path)
          restored <- read_dta(path, output = "tibble", threads = 1L)
          stopifnot(identical(as.numeric(restored$value), data$value))
          stopifnot(identical(as.character(restored$code), data$code))
          unlink(path)
          notice <- system.file("NOTICE", package = "dtatools", mustWork = TRUE)
          expected <- readLines("r-package/dtatools/inst/NOTICE", warn = FALSE)
          stopifnot(identical(readLines(notice, warn = FALSE), expected))
          binary <- Sys.glob(file.path("release-build", "binary", "dtatools_*"))
          stopifnot(length(binary) == 1L)
          unpacked <- tempfile("dtatools-binary-")
          dir.create(unpacked)
          if (grepl("[.]zip$", binary)) utils::unzip(binary, exdir = unpacked) else utils::untar(binary, exdir = unpacked)
          stopifnot(identical(readLines(file.path(unpacked, "dtatools", "NOTICE"), warn = FALSE), expected))

      - name: Stage binary for release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error
          retention-days: 1

      - name: Stage source for release
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r-package-source
          path: release-build/source/dtatools_*.tar.gz
          if-no-files-found: error
          retention-days: 1

  attach:
    name: Attach R binaries to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download compiled packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: r-package-*
          path: release-assets
          merge-multiple: true

      - name: Attach compiled packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
