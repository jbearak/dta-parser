name: Private active C manual extraction (no security queries)
"on":
  push:
    branches: [codex/codeql-manual-extraction-diagnostic]
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  manual:
    name: Active51 manual extraction only (not a production security gate)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CODEQL_OVERLAY_DATABASE_MODE: none
      CARGO_NET_OFFLINE: "true"
      RUSTUP_TOOLCHAIN: "1.98.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          r-version: "4.6.0"
          use-public-rspm: true
      - name: Prepare the existing supported native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev pkg-config clang
          rustup toolchain install 1.98.0 --profile minimal
      - name: Bind original source and prebuild only Rust dependencies before tracing
        run: >-
          python3 .github/codeql/manual-extraction/build.py prebuild
          --root "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/manual-work"
      - name: Download and verify the exact official bundle
        run: >-
          python3 .github/codeql/manual-extraction/build.py bundle
          --root "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/manual-work"
      - name: Initialize actual C compilation tracing
        id: init
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: c-cpp
          build-mode: manual
          tools: ${{ runner.temp }}/manual-work/official-codeql-bundle.tar.gz
          config-file: .github/codeql/manual-extraction/cpp-manual.yml
          db-location: ${{ runner.temp }}/manual-db
          trap-caching: false
          dependency-caching: false
          debug: false
      - name: Bind the actual manual configuration and unchanged default query inventory
        run: >-
          python3 .github/codeql/manual-extraction/collector.py initialized
          --root "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/manual-work"
          --database "$RUNNER_TEMP/manual-db" --codeql "${{ steps.init.outputs.codeql-path }}"
      - name: Compile every active original C translation unit with its actual includes
        run: >-
          python3 .github/codeql/manual-extraction/build.py build
          --root "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/manual-work"
      - name: Finalize extraction without security evaluation or upload
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          output: ${{ runner.temp }}/manual-unused-sarif
          skip-queries: true
          upload: never
          upload-database: false
          category: /private-extraction/manual-active51
      - name: Collect bounded extraction facts under the separate active-source contract
        run: >-
          python3 .github/codeql/manual-extraction/collector.py collect
          --root "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/manual-work"
          --database "$RUNNER_TEMP/manual-db" --codeql "${{ steps.init.outputs.codeql-path }}"
      - name: Preserve raw diagnostics and the actual failure or success
        if: always()
        env:
          OBSERVED_JOB_STATUS: ${{ job.status }}
        run: >-
          python3 .github/codeql/manual-extraction/collector.py finish
          --root "$GITHUB_WORKSPACE" --work "$RUNNER_TEMP/manual-work"
          --database "$RUNNER_TEMP/manual-db" --codeql "${{ steps.init.outputs.codeql-path }}"
      - name: Retain text diagnostics and receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: manual-active51-extraction
          path: ${{ runner.temp }}/manual-work/extraction
          if-no-files-found: error
          retention-days: 14
