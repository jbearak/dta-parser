name: CodeQL C++ capacity qualification (no security upload)
on:
  push:
    branches: [codex/codeql-capacity-qualification]
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  capacity:
    name: Full C++ capacity experiment, not a production security gate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CODEQL_OVERLAY_DATABASE_MODE: none
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # same v6 as current managed scan
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind unchanged final source and exact archival exclusions
        run: python3 .github/codeql/capacity-guard.py prepare
      - name: Download and verify the exact official CLI bundle
        run: python3 .github/codeql/capacity-guard.py bundle
      - name: Initialize the same CLI and default C++ query suite
        id: init
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: c-cpp
          build-mode: none
          tools: ${{ runner.temp }}/codeql-capacity-bundle.tar.gz
          config-file: .github/codeql/capacity-config.yml
          db-location: ${{ runner.temp }}/codeql-capacity-db
          trap-caching: false
          dependency-caching: false
          debug: false
      - name: Bind the generated suite and compile the separate coverage helper
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
        run: python3 .github/codeql/capacity-guard.py initialized
      - name: Run all default queries without Code Scanning or database upload
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          output: ${{ runner.temp }}/codeql-capacity-sarif
          upload: never
          upload-database: false
          skip-queries: false
          category: /capacity-qualification/cpp-no-upload
      - name: Verify all 61 results and separately collect actual extracted files
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
        run: python3 .github/codeql/capacity-guard.py verify
      - name: Retain resource state even after a failed analysis
        if: always()
        run: python3 .github/codeql/capacity-guard.py finish
      - name: Retain qualification records as Actions artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # same v7.0.1 as current CI
        with:
          name: cpp-capacity-qualification
          path: |
            ${{ runner.temp }}/codeql-capacity-results
            ${{ runner.temp }}/codeql-capacity-sarif
            ${{ runner.temp }}/codeql-capacity-db/log
            ${{ runner.temp }}/codeql-capacity-db/cpp/log
          if-no-files-found: error
          retention-days: 14
