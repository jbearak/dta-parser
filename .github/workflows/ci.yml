name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/build-wasm.sh
      - run: npm ci
        working-directory: js
      - run: npm run build
        working-directory: js
      - run: npm test
        working-directory: js

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/dtatools
          extra-packages: any::haven, any::testthat
      # Build the self-contained source package, then install it from
      # outside the checkout, as a user without the repository would.
      - run: scripts/build-r-package.sh
      - run: |
          cd "$RUNNER_TEMP"
          R CMD INSTALL "$GITHUB_WORKSPACE"/r/dtatools_*.tar.gz
      - run: Rscript -e 'testthat::test_dir("r/dtatools/tests/testthat", package = "dtatools", load_package = "installed")'
