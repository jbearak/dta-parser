name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    name: TypeScript / Bun
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript/dta-parser
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun scripts/check-conformance.ts
        working-directory: .

  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.74.0"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt,clippy
      - run: cargo +${{ matrix.toolchain }} fmt --all --check
      - run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --workspace --all-targets --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo +${{ matrix.toolchain }} doc --workspace --locked --no-deps
      - run: cargo +${{ matrix.toolchain }} package -p dta-parser --locked
      - name: Check isolated R bridge offline at MSRV
        if: matrix.toolchain == '1.74.0'
        working-directory: r-package/dtaparser/src
        shell: bash
        env:
          CARGO_TARGET_DIR: ../../../target
        run: |
          tar -xzf rust/vendor.tar.gz -C rust
          cargo +${{ matrix.toolchain }} check --manifest-path rust/Cargo.toml --config rust/cargo-config.toml --locked --offline

  fuzz-smoke:
    name: Deterministic fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: DTA_FUZZ_CASES=16 cargo +stable test -p dta-parser --locked --test fuzz_smoke -- --nocapture

  r-cargo-vendor:
    name: R offline Cargo dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: scripts/check-r-cargo-vendor.sh
      - run: scripts/rebuild-r-vendor.sh
      - run: git diff --exit-code -- r-package/dtaparser/src/rust/vendor.tar.gz
      - run: bun test tests/integration/benchmark-config.test.ts tests/integration/fixture-inventory.test.ts

  r-package:
    name: R package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      _R_CHECK_FORCE_SUGGESTS_: "true"
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@bd49c52ffe281809afa6f0fecbf37483c5dd0b93 # v2.11.3
        with:
          use-public-rspm: true
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        if: runner.os == 'Linux'
        with:
          bun-version: 1.3.14
      - name: Install GNU Rust for Rtools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustup target add x86_64-pc-windows-gnu --toolchain stable-x86_64-pc-windows-gnu
          rustc -vV | grep 'host: x86_64-pc-windows-gnu'
      - name: Install Rust
        if: runner.os != 'Windows'
        shell: bash
        run: rustup toolchain install stable --profile minimal
      - name: Install R dependencies
        shell: Rscript {0}
        run: install.packages(c("readr", "rlang", "tibble", "tidyselect", "testthat", "haven", "callr", "httpuv"))
      - name: Test Rust source hash validation
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/test-rust-source-hash.sh
      - name: Build and check package from offline Cargo archive
        if: runner.os != 'Linux'
        shell: bash
        run: |
          R CMD build r-package/dtaparser
          version=$(sed -n 's/^Version: //p' r-package/dtaparser/DESCRIPTION)
          tarball="dtaparser_${version}.tar.gz"
          scripts/check-r-package-archive.sh "$tarball"
          R CMD check --no-manual --as-cran "$tarball"
      - name: Run the single required conformance orchestrator
        if: runner.os == 'Linux'
        shell: bash
        run: DTA_REQUIRE_R_CONFORMANCE=1 scripts/conformance.sh
