name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The Parquet core builds for wasm; libzstd needs a clang that
      # targets wasm32 (scripts/build-wasm.sh).
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - run: cargo build -p dta-parquet --target wasm32-unknown-unknown
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
      # Reported, not gated: wall and CPU time of reads and writes with 1
      # to 8 threads on x86 (plan 0007), on a 1.4 GB file it writes.
      - name: Thread scaling on x86
        run: cargo run --release -p dta --example threads -- --synthetic "$RUNNER_TEMP"

  # The licences of every crate the workspace uses (deny.toml).
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  # Parquet (plan 0018): pyarrow's reading of the committed fixtures is
  # still what compat/parquet/expected holds, and pyarrow, pandas, polars
  # and DuckDB read back the files dta-parquet writes, and those Python's
  # datakit writes (plan 0019).
  parquet-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyarrow pandas polars duckdb maturin
      - run: maturin build --release --out dist
        working-directory: python
      - run: pip install python/dist/*.whl ./python/datakit
      - run: python compat/parquet/expected.py
      - name: Committed expected values match pyarrow's reading
        run: git diff --exit-code -- compat/parquet/expected
      - run: cargo run -p dta-parquet --example samples -- "$RUNNER_TEMP/parquet"
      - run: python compat/parquet/readback.py "$RUNNER_TEMP/parquet"

  # arrow (R) and nanoparquet read back the files dta-parquet writes.
  parquet-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("arrow", "nanoparquet", "haven", "jsonlite"))'
      - run: cargo run -p dta-parquet --example samples -- "$RUNNER_TEMP/parquet"
      - run: Rscript compat/parquet/readback.R "$RUNNER_TEMP/parquet"

  # Relative links and anchors in the Markdown docs. The docs' code
  # examples run in each language's own job (test-docs.R, test_docs.py,
  # docs.jl, docs.test.mjs).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 docs/check/check_links.py

  npm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24 is the oldest Node the package supports; 26 the newest.
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # libzstd in the module needs a clang that targets wasm32.
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - run: scripts/build-wasm.sh
      - run: npm ci
        working-directory: js
      - run: npm run build
        working-directory: js
      - run: npm test
        working-directory: js

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # datakit and dtatools import dtaparser, which is on no registry, so
      # resolve dtaparser's dependencies and add the others' by hand.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/dtaparser
          extra-packages: any::vctrs, any::haven, any::testthat, any::dplyr, any::readstata13, any::RcppTOML, any::bit64, any::jsonlite, any::arrow, any::nanoparquet
      # Build the source packages, then install them from outside the
      # checkout, as a user without the repository would.
      - run: scripts/build-r-package.sh
      # Installs from GitHub build r/dtaparser alone, from the committed
      # copy of the Rust core; configure just refreshed it from crates/dta
      # and crates/parquet.
      - name: Committed Rust core matches crates/dta and crates/parquet
        run: test -z "$(git status --porcelain -- r/dtaparser/src/rust/dta r/dtaparser/src/rust/parquet)"
      # The source package carries its crates.io crates (plan 0018): it
      # builds with cargo offline and an empty cargo home, so nothing can
      # come from the network or a cache.
      - name: dtaparser's source package builds offline
        run: |
          home="$(mktemp -d)"
          lib="$(mktemp -d)"
          cd "$RUNNER_TEMP"
          CARGO_NET_OFFLINE=true CARGO_HOME="$home" R CMD INSTALL -l "$lib" "$GITHUB_WORKSPACE"/r/dtaparser_*.tar.gz
          test -z "$(find "$home" -name '*.crate')"
      - run: |
          cd "$RUNNER_TEMP"
          R CMD INSTALL "$GITHUB_WORKSPACE"/r/dtaparser_*.tar.gz
          R CMD INSTALL "$GITHUB_WORKSPACE"/r/datakit_*.tar.gz
          R CMD INSTALL "$GITHUB_WORKSPACE"/r/dtatools_*.tar.gz
      - run: Rscript -e 'testthat::test_dir("r/dtaparser/tests/testthat", package = "dtaparser", load_package = "installed")'
      - run: Rscript -e 'testthat::test_dir("r/datakit/tests/testthat", package = "datakit", load_package = "installed")'
      - run: Rscript -e 'testthat::test_dir("r/dtatools/tests/testthat", package = "dtatools", load_package = "installed")'
      # The Raven sidecars (ADR 0032) are TOML; Raven itself is not run.
      - run: python3 -c 'import sys, tomllib; [tomllib.load(open(p, "rb")) for p in sys.argv[1:]]' r/datakit/inst/raven/nse.toml r/dtatools/inst/raven/nse.toml
      # Again with tiny chunks and four threads, so small files take the
      # parallel read and write paths.
      - run: |
          Rscript -e 'testthat::test_dir("r/dtaparser/tests/testthat", package = "dtaparser", load_package = "installed")'
          Rscript -e 'testthat::test_dir("r/datakit/tests/testthat", package = "datakit", load_package = "installed")'
          Rscript -e 'testthat::test_dir("r/dtatools/tests/testthat", package = "dtatools", load_package = "installed")'
        env:
          DTA_TEST_SMALL_CHUNKS: "1"
          DTA_THREADS: "4"

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: cargo clippy --manifest-path python/Cargo.toml --all-targets -- -D warnings
      # Build the abi3 wheel and install it, so the tests import what a
      # user would install, not the source tree.
      - run: pip install maturin
      - run: maturin build --release --out dist
        working-directory: python
      - run: pip install python/dist/*.whl pytest pyreadstat
      - run: python -m pytest python/tests
      - run: python -m pytest python/tests
        env:
          DTA_TEST_SMALL_CHUNKS: "1"
          DTA_THREADS: "4"
      # With pyarrow and polars, the tests of dta_parser's Arrow path
      # (python/tests/test_arrow.py) run too.
      - run: pip install pyarrow polars
      - run: python -m pytest python/tests

  # Python's datakit (plan 0019): pure Python on dta_parser's wheel. Its
  # tests (the docs' examples among them), with small chunks and threads
  # too; then both sdists build offline and install into a fresh venv,
  # which imports datakit without pandas.
  datakit-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install maturin setuptools
      - run: maturin build --release --out dist
        working-directory: python
      - run: pip install python/dist/*.whl ./python/datakit pytest pyarrow duckdb
      - run: python -m pytest python/datakit/tests
      - run: python -m pytest python/datakit/tests
        env:
          DTA_TEST_SMALL_CHUNKS: "1"
          DTA_THREADS: "4"
      - name: Both sdists build offline
        # Without build isolation the runner's own setuptools builds
        # datakit; it needs 77 or later for an SPDX license string.
        run: |
          pip install "setuptools>=77"
          maturin sdist --out "$RUNNER_TEMP/sdist"
          (cd datakit && python -c "from setuptools import build_meta as b; b.build_sdist('$RUNNER_TEMP/sdist')")
          CARGO_NET_OFFLINE=true pip wheel --no-index --no-build-isolation --no-deps -w "$RUNNER_TEMP/wheels" "$RUNNER_TEMP"/sdist/*.tar.gz
        working-directory: python
      - name: A fresh venv installs both and imports datakit without pandas
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/wheels/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" -c "import sys, datakit; assert 'pandas' not in sys.modules"

  # One abi3 wheel per supported platform, each installed into a fresh
  # venv and smoke-tested. Nothing is published.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2014" }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2014" }
          - { os: macos-latest, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # On Linux this builds in a manylinux2014 container (a cross one for
      # aarch64).
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          working-directory: python
      - name: Smoke-test the wheel in a fresh venv
        if: matrix.target != 'aarch64' || runner.os != 'Linux'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -f "$RUNNER_TEMP/venv/Scripts/python.exe" ]; then
            py="$RUNNER_TEMP/venv/Scripts/python.exe"
          else
            py="$RUNNER_TEMP/venv/bin/python"
          fi
          "$py" -m pip install python/dist/*.whl
          cd "$RUNNER_TEMP"
          "$py" "$GITHUB_WORKSPACE/python/tests/smoke.py"
      - uses: docker/setup-qemu-action@v3
        if: matrix.target == 'aarch64' && runner.os == 'Linux'
        with:
          platforms: arm64
      - name: Smoke-test the wheel in a fresh venv on arm64 (QEMU)
        if: matrix.target == 'aarch64' && runner.os == 'Linux'
        run: |
          docker run --rm --platform linux/arm64 -v "$GITHUB_WORKSPACE:/w:ro" -w /tmp python:3.12-slim \
            bash -c 'python -m venv /tmp/venv && /tmp/venv/bin/pip install /w/python/dist/*.whl && /tmp/venv/bin/python /w/python/tests/smoke.py'

  # The rust job's `cargo test --workspace` already runs the C ABI tests
  # (crates/dta-ffi/tests/capi.rs). Here Pkg.build runs deps/build.jl,
  # which builds the library with cargo.
  julia:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        julia: ["1.10", "1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - run: julia --project=julia/DtaParser -e 'using Pkg; Pkg.instantiate(); Pkg.build(); Pkg.test()'
      - run: julia --project=julia/DtaParser -e 'using Pkg; Pkg.test()'
        env:
          DTA_TEST_SMALL_CHUNKS: "1"
          DTA_THREADS: "4"

  # Datakit (julia/Datakit), on DtaParser from the same checkout: its
  # tests, which include the docs tests (docs/julia.md and its README),
  # and installing both into a fresh depot. Julia 1.10 does not read
  # [sources], so DtaParser is developed into Datakit's environment first.
  datakit-julia:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        julia: ["1.10", "1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - run: julia --project=julia/Datakit -e 'using Pkg; Pkg.develop(path="julia/DtaParser"); Pkg.instantiate(); Pkg.build("DtaParser"); Pkg.test()'
      - run: julia --project=julia/Datakit -e 'using Pkg; Pkg.test()'
        env:
          DTA_TEST_SMALL_CHUNKS: "1"
          DTA_THREADS: "4"
      - run: julia --startup-file=no julia/Datakit/test/install.jl

  # Windows: the core's tests (writes may use threads there; reads stay
  # serial), and the native library builds (dta_ffi.dll), loads, and
  # reads and writes a path with non-ASCII characters, in DtaParser and
  # in Datakit (Parquet and fixed-width text).
  julia-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p dta
      - run: cargo build --release -p dta-ffi
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - run: julia --project=julia/DtaParser -e 'using Pkg; Pkg.instantiate(); Pkg.build()'
      - run: julia --project=julia/DtaParser julia/DtaParser/test/smoke.jl
      - run: julia --project=julia/Datakit -e 'using Pkg; Pkg.develop(path="julia/DtaParser"); Pkg.instantiate()'
      - run: julia --project=julia/Datakit julia/Datakit/test/smoke.jl

  # Files written by dtatools and by the npm package read back in pandas
  # as their originals do (haven and readstata13 are checked in the R
  # tests).
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/dtaparser
          extra-packages: any::vctrs
      - run: pip install pandas
      - run: R CMD INSTALL r/dtaparser && R CMD INSTALL r/datakit && R CMD INSTALL r/dtatools
      # libzstd in the module needs a clang that targets wasm32.
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - run: scripts/build-wasm.sh && cd js && npm ci && npm run build
      - run: Rscript compat/readback.R "$RUNNER_TEMP/r" && python3 compat/readback.py "$RUNNER_TEMP/r"
      - run: node compat/readback.mjs "$RUNNER_TEMP/js" && python3 compat/readback.py "$RUNNER_TEMP/js"
      # hyparquet reads back the Parquet files the npm package writes.
      - run: npm ci
        working-directory: bench/node
      - run: node compat/parquet/readback.mjs bench/node/node_modules
