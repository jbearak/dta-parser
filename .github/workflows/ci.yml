name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    name: TypeScript / Bun
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript/dta-parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun scripts/check-conformance.ts
        working-directory: .

  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.98.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt,clippy
      - run: cargo +${{ matrix.toolchain }} fmt --all --check
      - run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +${{ matrix.toolchain }} test --workspace --all-targets --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo +${{ matrix.toolchain }} doc --workspace --locked --no-deps
      - run: cargo +${{ matrix.toolchain }} package -p dta-tools --locked
      - name: Check and test isolated R bridge offline
        if: matrix.toolchain == 'stable'
        working-directory: r-package/dtatools/src
        shell: bash
        env:
          CARGO_TARGET_DIR: ../../../target
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          tar -xzf rust/vendor.tar.gz -C rust
          cargo +1.98.0 check --manifest-path rust/Cargo.toml --config rust/cargo-config.toml --locked --offline
          cargo +1.98.0 test --manifest-path rust/Cargo.toml --config rust/cargo-config.toml --all-targets --locked --offline

  fuzz-smoke:
    name: Deterministic fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: DTA_FUZZ_CASES=16 cargo +stable test -p dta-tools --locked --test fuzz_smoke -- --nocapture

  r-cargo-vendor:
    name: R offline Cargo dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: scripts/check-r-cargo-vendor.sh
      - run: scripts/rebuild-r-vendor.sh
      - run: git diff --exit-code -- r-package/dtatools/src/rust/vendor.tar.gz
      - run: >-
          bun test
          tests/integration/benchmark-config.test.ts
          tests/integration/fixture-inventory.test.ts
          tests/integration/typescript-product-benchmarks.test.ts

  r-package:
    name: R package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_toolchain: 1.98.0
          - os: macos-latest
            rust_toolchain: 1.98.0
          - os: windows-latest
            rust_toolchain: 1.98.0-x86_64-pc-windows-gnu
    env:
      _R_CHECK_FORCE_SUGGESTS_: "true"
      NOT_CRAN: "true"
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Disable unused Chrome apt repository
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Chrome is not used by these R jobs. A stale browser index must not
          # prevent setup-r from installing R and its system dependencies.
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [[ -f "$source" ]]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          use-public-rspm: true
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        if: runner.os == 'Linux'
        with:
          bun-version: 1.3.14
      - name: Install GNU Rust for Rtools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
          rust_version="$(rustc --version | awk '{print $2}')"
          rust_host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$rust_version-$rust_host" != "$RUSTUP_TOOLCHAIN" ]; then
            echo "Rust $rust_version host $rust_host does not match $RUSTUP_TOOLCHAIN" >&2
            exit 1
          fi
      - name: Install Rust
        if: runner.os != 'Windows'
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
      - name: Install package and declared test dependencies
        shell: Rscript {0}
        run: install.packages(c("readr", "rlang", "tibble", "tidyselect", "testthat", "dplyr", "callr", "data.table", "httpuv", "arrow", "roxygen2", "stringi", "jsonlite", "purrr", "haven", "labelled"))
      - name: Check generated documentation is up to date
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/check-r-roxygen.sh
      - name: Test Rust source hash validation
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/test-rust-source-hash.sh
      - name: Test corpus benchmark aggregation
        if: runner.os == 'Linux'
        shell: bash
        run: Rscript --vanilla benchmarks/r-corpus-performance/test-framework.R
      - name: Build and check package from offline Cargo archive
        if: runner.os != 'Linux'
        shell: bash
        run: |
          R CMD build r-package/dtatools
          version=$(Rscript --vanilla -e 'cat(read.dcf("r-package/dtatools/DESCRIPTION", fields = "Version"))')
          tarball="dtatools_${version}.tar.gz"
          scripts/check-r-package-archive.sh "$tarball"
          R CMD check --no-manual --as-cran "$tarball"
      - name: Run the single required conformance orchestrator
        if: runner.os == 'Linux'
        shell: bash
        run: DTA_REQUIRE_R_CONFORMANCE=1 scripts/conformance.sh
      - name: Print complete R check failure logs
        if: failure()
        shell: Rscript {0}
        run: |
          check_dirs <- list.dirs(".", recursive = FALSE, full.names = TRUE)
          check_dirs <- check_dirs[endsWith(check_dirs, ".Rcheck")]
          for (check_dir in check_dirs) {
            logs <- list.files(check_dir, pattern = "\\.(log|Rout(\\.fail)?)$",
                               recursive = TRUE, full.names = TRUE)
            for (path in logs) {
              cat("\n--- ", path, " ---\n", sep = "")
              writeLines(readLines(path, warn = FALSE))
            }
          }
      - name: Preserve R check failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r-check-failure-${{ matrix.os }}
          path: |
            *.Rcheck/00*.log
            *.Rcheck/tests/*.Rout*
            *.Rcheck/tests/testthat-problems.rds
          if-no-files-found: ignore
      - name: Locate failed Windows owned-column tests
        if: failure() && runner.os == 'Windows'
        shell: Rscript {0}
        run: |
          check_dir <- "dtatools.Rcheck"
          test_dir <- file.path(check_dir, "tests", "testthat")
          if (dir.exists(file.path(check_dir, "dtatools")) && dir.exists(test_dir)) {
            .libPaths(c(normalizePath(check_dir), .libPaths()))
            package_path <- getNamespaceInfo(loadNamespace("dtatools"), "path")
            stopifnot(identical(normalizePath(package_path),
                                normalizePath(file.path(check_dir, "dtatools"))))
            reporter <- R6::R6Class("FlushedLocationReporter",
              inherit = testthat::LocationReporter,
              public = list(cat_line = function(...) {
                super$cat_line(...)
                flush(self$out)
              }))$new(file = stderr())
            cat("Starting installed Windows owned-column diagnostics\n", file = stderr())
            flush(stderr())
            testthat::test_dir(test_dir, filter = "owned", reporter = reporter,
                               package = "dtatools", load_package = "installed")
            cat("Completed installed Windows owned-column diagnostics\n", file = stderr())
            flush(stderr())
          }
      - name: Install pinned interoperability baselines
        shell: Rscript {0}
        run: |
          install.packages("remotes")
          remotes::install_version("haven", "2.5.5", upgrade = "never")
          remotes::install_version("labelled", "2.16.0", upgrade = "never")
      - name: Test repository-only labelled and Haven conformance
        shell: bash
        run: |
          R CMD INSTALL r-package/dtatools
          Rscript --vanilla scripts/test-haven-conformance.R
          Rscript --vanilla scripts/test-labelled-interop.R
          Rscript --vanilla scripts/test-haven-helper-interop.R

  r-minimum:
    name: R present / R ${{ matrix.r }} / dplyr ${{ matrix.dplyr }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - r: "4.6.0"
            dplyr: current
          - r: "4.6.0"
            dplyr: "1.2.1"
          - r: release
            dplyr: "1.2.1"
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Disable unused Chrome apt repository
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Chrome is not used by these R jobs. A stale browser index must not
          # prevent setup-r from installing R and its system dependencies.
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [[ -f "$source" ]]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
      - name: Install runtime and present test dependencies
        shell: Rscript {0}
        run: install.packages(c("dplyr", "readr", "rlang", "tibble", "tidyselect", "vctrs", "testthat", "callr", "data.table", "httpuv", "arrow", "stringi", "jsonlite", "purrr", "haven", "labelled"))
      - name: Install supported minimum dplyr
        if: matrix.dplyr == '1.2.1'
        shell: Rscript {0}
        run: |
          install.packages("remotes")
          remotes::install_version("dplyr", "1.2.1", upgrade = "never")
          stopifnot(as.character(packageVersion("dplyr")) == "1.2.1")
      - name: Install complete present tests
        run: R CMD INSTALL --install-tests r-package/dtatools
      - name: Run complete present suite
        shell: Rscript {0}
        run: |
          test_root <- system.file("tests", package = "dtatools", mustWork = TRUE)
          stopifnot(dir.exists(file.path(test_root, "testthat")))
          setwd(test_root)
          testthat::test_check("dtatools")

  r-native:
    name: R native / ${{ matrix.os }} / R ${{ matrix.r }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            r: release
            dependencies: current
            rust_toolchain: 1.98.0
          - os: macos-latest
            r: release
            dependencies: current
            rust_toolchain: 1.98.0
          - os: windows-latest
            r: release
            dependencies: current
            rust_toolchain: 1.98.0-x86_64-pc-windows-gnu
          - os: ubuntu-latest
            r: "4.6.0"
            dependencies: current
            rust_toolchain: 1.98.0
          - os: ubuntu-latest
            r: release
            dependencies: floors
            rust_toolchain: 1.98.0
          - os: ubuntu-latest
            r: "4.6.0"
            dependencies: floors
            rust_toolchain: 1.98.0
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_toolchain }}
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Disable unused Chrome apt repository
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Chrome is not used by these R jobs. A stale browser index must not
          # prevent setup-r from installing R and its system dependencies.
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [[ -f "$source" ]]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - name: Install selected Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup default "$RUSTUP_TOOLCHAIN"
      - name: Install native Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libuv1-dev pkg-config
      - name: Install CRAN macOS gettext build dependencies
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        shell: bash
        run: |
          base=https://mac.r-project.org/bin/darwin23/arm64
          cache="$RUNNER_TEMP/cran-gettext"
          mkdir -p "$cache"
          curl --fail --show-error --location --retry 3 "$base/texinfo-7.3-darwin.23-arm64.tar.xz" -o "$cache/texinfo.tar.xz"
          curl --fail --show-error --location --retry 3 "$base/gettext-0.22.5-darwin.23-arm64.tar.xz" -o "$cache/gettext.tar.xz"
          printf '%s  %s\n' \
            '78b7af1aea3fd725a77c6cc7295a717bdc94e1d534c5acb3801646d72c4515dd' "$cache/texinfo.tar.xz" \
            'bdc3356cfb2c8dd69618fd76975474f4ec793cbe8f4894389d0426da8f4facc3' "$cache/gettext.tar.xz" | shasum -a 256 -c -
          sudo tar -xf "$cache/texinfo.tar.xz" -C /
          sudo tar -xf "$cache/gettext.tar.xz" -C /
          test -s /opt/R/arm64/include/libintl.h
          test -s /opt/R/arm64/lib/libintl.a

      - name: Provision physical native dependency libraries
        shell: bash
        run: >-
          Rscript --vanilla scripts/provision-r-native-libraries.R
          r-package/dtatools native-libraries ${{ matrix.dependencies }} native with-arrow
      - name: Build and qualify source with isolated native dependencies
        shell: bash
        run: |
          python scripts/build-r-native.py r-package/dtatools \
            native-libraries/evidence/lane-plan.json native native-build
          version=$(Rscript --vanilla -e 'cat(read.dcf("r-package/dtatools/DESCRIPTION", fields = "Version"))')
          python scripts/check-r-native.py "native-build/payload/dtatools_${version}.tar.gz" \
            native-libraries/evidence/lane-plan.json native native-check
      - name: Retain native qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.os }}-${{ matrix.r }}-${{ matrix.dependencies }}
          path: |
            native-libraries/evidence
            native-build/evidence
            native-check/evidence
          if-no-files-found: warn
