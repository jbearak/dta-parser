name: CI

# Everyday checks deliberately avoid R provisioning, archive builds, full
# compatibility matrices and performance-evidence replay. Run focused R tests
# locally; exhaustive checks are available in full-compatibility.yml.
on:
  pull_request:
    paths:
      - '.github/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'r-package/**'
      - 'typescript/**'
      - 'tests/**'
      - 'conformance/**'
      - 'scripts/**'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    name: TypeScript / Bun
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: typescript/dta-parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  rust:
    name: Rust stable
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy -p dta-tools --lib --locked -- -D warnings
      - name: Test Rust core and compact R output planner once
        run: cargo +stable test -p dta-tools --lib --features r-adapter-internal --locked

  source-guards:
    name: Repository guards
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Check source and native test inventories
        run: >-
          python3 -m unittest
          scripts.test_arithmetic_dependencies
          scripts.test_native_manifest
          scripts.test_reader_install
          scripts.test_r_dependency_cache
      - name: Check existing offline Cargo archive integrity
        run: scripts/check-r-cargo-vendor.sh
      - name: Test native security evidence collector
        run: |
          python3 .github/codeql/test_collector.py
          python3 -O .github/codeql/test_collector.py
