name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Relative links and anchors in the Markdown docs. The docs' code
  # examples run in each language's own job (test-docs.R, test_docs.py,
  # docs.jl, docs.test.mjs).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 docs/check/check_links.py

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/build-wasm.sh
      - run: npm ci
        working-directory: js
      - run: npm run build
        working-directory: js
      - run: npm test
        working-directory: js

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/dtatools
          extra-packages: any::haven, any::testthat
      # Build the self-contained source package, then install it from
      # outside the checkout, as a user without the repository would.
      - run: scripts/build-r-package.sh
      - run: |
          cd "$RUNNER_TEMP"
          R CMD INSTALL "$GITHUB_WORKSPACE"/r/dtatools_*.tar.gz
      - run: Rscript -e 'testthat::test_dir("r/dtatools/tests/testthat", package = "dtatools", load_package = "installed")'

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: cargo clippy --manifest-path python/Cargo.toml --all-targets -- -D warnings
      # Build the abi3 wheel and install it, so the tests import what a
      # user would install, not the source tree.
      - run: pip install maturin
      - run: maturin build --release --out dist
        working-directory: python
      - run: pip install python/dist/*.whl pytest pyreadstat
      - run: python -m pytest python/tests

  # One abi3 wheel per supported platform, each installed into a fresh
  # venv and smoke-tested. Nothing is published.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2014" }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2014" }
          - { os: macos-latest, target: aarch64, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # On Linux this builds in a manylinux2014 container (a cross one for
      # aarch64).
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          working-directory: python
      - name: Smoke-test the wheel in a fresh venv
        if: matrix.target != 'aarch64' || runner.os != 'Linux'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -f "$RUNNER_TEMP/venv/Scripts/python.exe" ]; then
            py="$RUNNER_TEMP/venv/Scripts/python.exe"
          else
            py="$RUNNER_TEMP/venv/bin/python"
          fi
          "$py" -m pip install python/dist/*.whl
          cd "$RUNNER_TEMP"
          "$py" "$GITHUB_WORKSPACE/python/tests/smoke.py"
      - uses: docker/setup-qemu-action@v3
        if: matrix.target == 'aarch64' && runner.os == 'Linux'
        with:
          platforms: arm64
      - name: Smoke-test the wheel in a fresh venv on arm64 (QEMU)
        if: matrix.target == 'aarch64' && runner.os == 'Linux'
        run: |
          docker run --rm --platform linux/arm64 -v "$GITHUB_WORKSPACE:/w:ro" -w /tmp python:3.12-slim \
            bash -c 'python -m venv /tmp/venv && /tmp/venv/bin/pip install /w/python/dist/*.whl && /tmp/venv/bin/python /w/python/tests/smoke.py'

  # The rust job's `cargo test --workspace` already runs the C ABI tests
  # (crates/dta-ffi/tests/capi.rs). Here Pkg.build runs deps/build.jl,
  # which builds the library with cargo.
  julia:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        julia: ["1.10", "1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - run: julia --project=julia/DtaParser -e 'using Pkg; Pkg.instantiate(); Pkg.build(); Pkg.test()'

  # Windows: the native library builds (dta_ffi.dll), loads, and reads
  # and writes a path with non-ASCII characters.
  julia-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p dta-ffi
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - run: julia --project=julia/DtaParser -e 'using Pkg; Pkg.instantiate(); Pkg.build()'
      - run: julia --project=julia/DtaParser julia/DtaParser/test/smoke.jl

  # Files written by dtatools and by the npm package read back in pandas
  # as their originals do (haven and readstata13 are checked in the R
  # tests).
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/dtatools
      - run: pip install pandas
      - run: R CMD INSTALL r/dtatools
      - run: scripts/build-wasm.sh && cd js && npm ci && npm run build
      - run: Rscript compat/readback.R "$RUNNER_TEMP/r" && python3 compat/readback.py "$RUNNER_TEMP/r"
      - run: node compat/readback.mjs "$RUNNER_TEMP/js" && python3 compat/readback.py "$RUNNER_TEMP/js"
