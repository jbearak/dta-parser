name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The Parquet core builds for wasm; libzstd needs a clang that
      # targets wasm32 (scripts/build-wasm.sh).
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - run: cargo build -p dta-parquet --target wasm32-unknown-unknown
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
      # Reported, not gated: wall and CPU time of reads and writes with 1
      # to 8 threads on x86 (plan 0007), on a 1.4 GB file it writes.
      - name: Thread scaling on x86
        run: cargo run --release -p dta --example threads -- --synthetic "$RUNNER_TEMP"

  # The .dta core on Windows, where paths, files, and threads differ.
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p dta

  # The licences of every crate the workspace uses (deny.toml).
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  # Parquet (plan 0018): pyarrow's reading of the committed fixtures and
  # of the legacy fixtures is still what their expected/ holds, and
  # pyarrow, pandas, polars, and DuckDB read back the files dta-parquet
  # writes.
  parquet-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyarrow pandas polars duckdb
      - run: python compat/parquet/expected.py
      - run: python compat/parquet/legacy/expected.py
      - name: Committed expected values match pyarrow's reading
        run: git diff --exit-code -- compat/parquet/expected compat/parquet/legacy/expected
      - run: cargo run -p dta-parquet --example samples -- "$RUNNER_TEMP/parquet"
      - run: python compat/parquet/readback.py "$RUNNER_TEMP/parquet"

  # arrow (R) and nanoparquet read back the files dta-parquet writes.
  parquet-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: Rscript -e 'install.packages(c("arrow", "nanoparquet", "haven", "jsonlite", "rlang", "tibble", "tidyselect", "vctrs"))'
      - run: cargo run -p dta-parquet --example samples -- "$RUNNER_TEMP/parquet"
      - run: Rscript compat/parquet/readback.R "$RUNNER_TEMP/parquet"

  # Relative links and anchors in the Markdown docs. The docs' code
  # examples run in each language's own job (test-docs.R,
  # docs.test.mjs).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 docs/check/check_links.py

  npm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24 is the oldest Node the package supports; 26 the newest.
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # libzstd in the module needs a clang that targets wasm32.
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - run: scripts/build-wasm.sh
      - run: npm ci
        working-directory: js
      - run: npm run build
        working-directory: js
      - run: npm test
        working-directory: js
      # datakit (plan 0021), against the dta-parser just built: its
      # devDependency links ../ as @jbearak/dta-parser.
      - run: npm ci
        working-directory: js/datakit
      - run: npm run build
        working-directory: js/datakit
      - run: npm test
        working-directory: js/datakit

  r:
    runs-on: ubuntu-latest
    # datakit's polars tests (plan 0025) fail instead of skipping when
    # polars or nanoarrow is missing, and so do the docs' polars examples.
    env:
      DATAKIT_REQUIRE_POLARS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # datakit and dtatools import dtaparser and datparser, which are on
      # no registry, so resolve dtaparser's dependencies and add the
      # others' by hand.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/dtaparser
          extra-packages: any::vctrs, any::haven, any::testthat, any::dplyr, any::readstata13, any::RcppTOML, any::bit64, any::jsonlite, any::arrow, any::nanoparquet, any::nanoarrow
      # R-multiverse has no polars binary for Ubuntu 24.04, so polars
      # installs from source; NOT_CRAN=true makes it download its
      # prebuilt Rust library instead of compiling it.
      - name: Install polars from R-multiverse
        shell: Rscript {0}
        env:
          NOT_CRAN: "true"
        run: install.packages("polars", repos = c("https://community.r-multiverse.org", getOption("repos")))
      # install.packages() only warns when an install fails.
      - name: polars and nanoarrow load
        run: Rscript -e 'library(polars); library(nanoarrow)'
      # Build the source packages, then install them from outside the
      # checkout, as a user without the repository would.
      - run: scripts/build-r-package.sh
      # Installs from GitHub build r/dtaparser and r/datparser alone, from
      # their committed copies of the Rust core; configure just refreshed
      # them from crates/dta, crates/parquet, and crates/arrow.
      - name: Committed Rust core matches crates/dta, crates/parquet, and crates/arrow
        run: test -z "$(git status --porcelain -- r/dtaparser/src/rust/dta r/dtaparser/src/rust/parquet r/dtaparser/src/rust/arrow r/datparser/src/rust/dta)"
      # The source package carries its crates.io crates (plan 0018): it
      # builds with cargo offline and an empty cargo home, so nothing can
      # come from the network or a cache.
      - name: dtaparser's and datparser's source packages build offline
        run: |
          home="$(mktemp -d)"
          lib="$(mktemp -d)"
          cd "$RUNNER_TEMP"
          CARGO_NET_OFFLINE=true CARGO_HOME="$home" R CMD INSTALL -l "$lib" "$GITHUB_WORKSPACE"/r/dtaparser_*.tar.gz
          CARGO_NET_OFFLINE=true CARGO_HOME="$home" R CMD INSTALL -l "$lib" "$GITHUB_WORKSPACE"/r/datparser_*.tar.gz
          test -z "$(find "$home" -name '*.crate')"
      - run: |
          cd "$RUNNER_TEMP"
          R CMD INSTALL "$GITHUB_WORKSPACE"/r/dtaparser_*.tar.gz
          R CMD INSTALL "$GITHUB_WORKSPACE"/r/datparser_*.tar.gz
          R CMD INSTALL "$GITHUB_WORKSPACE"/r/datakit_*.tar.gz
          R CMD INSTALL "$GITHUB_WORKSPACE"/r/dtatools_*.tar.gz
      - run: Rscript -e 'testthat::test_dir("r/dtaparser/tests/testthat", package = "dtaparser", load_package = "installed")'
      - run: Rscript -e 'testthat::test_dir("r/datparser/tests/testthat", package = "datparser", load_package = "installed")'
      - run: Rscript -e 'testthat::test_dir("r/datakit/tests/testthat", package = "datakit", load_package = "installed")'
      - run: Rscript -e 'testthat::test_dir("r/dtatools/tests/testthat", package = "dtatools", load_package = "installed")'
      # The Raven sidecars (ADR 0032) are TOML; Raven itself is not run.
      - run: python3 -c 'import sys, tomllib; [tomllib.load(open(p, "rb")) for p in sys.argv[1:]]' r/datakit/inst/raven/nse.toml r/dtatools/inst/raven/nse.toml
      # Again with tiny chunks and four threads, so small files take the
      # parallel read and write paths.
      - run: |
          Rscript -e 'testthat::test_dir("r/dtaparser/tests/testthat", package = "dtaparser", load_package = "installed")'
          Rscript -e 'testthat::test_dir("r/datparser/tests/testthat", package = "datparser", load_package = "installed")'
          Rscript -e 'testthat::test_dir("r/datakit/tests/testthat", package = "datakit", load_package = "installed")'
          Rscript -e 'testthat::test_dir("r/dtatools/tests/testthat", package = "dtatools", load_package = "installed")'
        env:
          DTA_TEST_SMALL_CHUNKS: "1"
          DTA_THREADS: "4"

  # Every writer's files read back in every other reader: dtaparser and
  # dtatools (R) and the npm package save the fixtures and
  # compat/readback's strL inputs again, and haven, readstata13, pandas,
  # and pyreadstat must read each copy as
  # they read its input (compat/readback/check.py, with its known
  # exceptions).
  readback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/dtaparser
          extra-packages: any::vctrs, any::haven, any::readstata13, any::jsonlite
      - run: pip install pandas pyreadstat
      - run: R CMD INSTALL r/dtaparser && R CMD INSTALL r/datparser && R CMD INSTALL r/datakit && R CMD INSTALL r/dtatools
      # libzstd in the module needs a clang that targets wasm32.
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - run: scripts/build-wasm.sh && cd js && npm ci && npm run build && cd datakit && npm ci && npm run build
      - run: sh compat/readback/run.sh "$RUNNER_TEMP/readback"
      # hyparquet reads back the Parquet files @jbearak/datakit writes.
      - run: npm ci
        working-directory: bench/node
      - run: node compat/parquet/readback.mjs bench/node/node_modules
