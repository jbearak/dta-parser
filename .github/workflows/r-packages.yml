# Binary R packages for macOS (arm64), Windows (x86_64) and Linux
# (Ubuntu 24.04, x86_64), for the current and previous R releases.
#
# On a pull request that touches the R packages or the Rust core, build
# and test them on each platform. On a tag r-v<version>, also publish:
# a CRAN-like repository on GitHub Pages, from which install.packages()
# and pak fetch dtatools, datakit, datparser, and dtaparser without a Rust toolchain, and a
# GitHub release holding the same files. Pages holds the latest release
# only; the releases keep every one.
#
# Pages must be set to deploy from GitHub Actions (Settings > Pages).

name: r-packages
on:
  push:
    tags: ["r-v*"]
  pull_request:
    paths:
      - "r/**"
      - "crates/dta/**"
      - "crates/parquet/**"
      - "crates/arrow/**"
      - "scripts/build-r-package.sh"
      - "scripts/place-r-binaries.R"
      - ".github/workflows/r-packages.yml"
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
      - run: scripts/build-r-package.sh
      - name: Versions match the tag
        if: startsWith(github.ref, 'refs/tags/r-v')
        run: |
          for p in dtaparser datparser datakit dtatools; do
            test -f "r/${p}_${GITHUB_REF_NAME#r-v}.tar.gz"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: r-source
          path: r/*.tar.gz

  binary:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
        r: [release, oldrel-1]
    runs-on: ${{ matrix.os }}
    env:
      # CRAN's arm64 builds of R run on macOS 11 and later.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/dtaparser
          extra-packages: any::vctrs, any::haven, any::testthat, any::dplyr, any::readstata13, any::RcppTOML, any::bit64, any::jsonlite
      - uses: actions/download-artifact@v4
        with:
          name: r-source
          path: source
      # Builds each binary from the source package, as a user without the
      # repository would, and installs it for the tests.
      - name: Build the binary packages
        shell: bash
        run: |
          mkdir built && cd built
          R CMD INSTALL --build ../source/dtaparser_*.tar.gz
          R CMD INSTALL --build ../source/datparser_*.tar.gz
          R CMD INSTALL --build ../source/datakit_*.tar.gz
          R CMD INSTALL --build ../source/dtatools_*.tar.gz
      - name: Test them
        shell: bash
        run: |
          Rscript -e 'testthat::test_dir("r/dtaparser/tests/testthat", package = "dtaparser", load_package = "installed")'
          Rscript -e 'testthat::test_dir("r/datparser/tests/testthat", package = "datparser", load_package = "installed")'
          Rscript -e 'testthat::test_dir("r/datakit/tests/testthat", package = "datakit", load_package = "installed")'
          Rscript -e 'testthat::test_dir("r/dtatools/tests/testthat", package = "dtatools", load_package = "installed")'
      - run: Rscript scripts/place-r-binaries.R built out
      - uses: actions/upload-artifact@v4
        with:
          name: r-binary-${{ matrix.os }}-${{ matrix.r }}
          path: out

  publish:
    if: startsWith(github.ref, 'refs/tags/r-v')
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble the repository
        run: |
          mkdir -p site/src/contrib assets
          cp artifacts/r-source/*.tar.gz site/src/contrib/
          cp artifacts/r-source/*.tar.gz assets/
          for d in artifacts/r-binary-*; do
            cp -R "$d"/repo/. site/
            cp "$d"/assets/* assets/
          done
          Rscript -e 'tools::write_PACKAGES("site/src/contrib", type = "source")'
          sed "s/@VERSION@/${GITHUB_REF_NAME#r-v}/g" scripts/r-repo-index.html > site/index.html
          find site -type f | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "R packages ${GITHUB_REF_NAME#r-v}" \
            --notes "dtatools, datakit, datparser, and dtaparser ${GITHUB_REF_NAME#r-v}: source packages, and binaries for macOS (arm64), Windows (x86_64) and Ubuntu 24.04 (x86_64). Install them with install.packages() from https://jbearak.github.io/dta-parser; see docs/r.md."
