[package]
name = "datparser"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["staticlib"]
path = "lib.rs"

# The dta core, for its fixed-width reader; it has no dependencies.
[dependencies]
dta = { path = "dta" }

# Not part of the dta-parser workspace.
[workspace]

[profile.release]
lto = true
codegen-units = 1
